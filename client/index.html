<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TENEND ONLINE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root { --bg:#120f1c; --panel:rgba(18,15,28,.94); --line:#4a3f6a; --gold:#ffd84a; --text:#e8e4f0; --dim:#8a84a0; --acc:#7fe8ff; }
* { box-sizing:border-box; }
html,body { margin:0; height:100%; overflow:hidden; background:#0b0a12; color:var(--text); font-family:Kanit, Tahoma, sans-serif; font-size:14px; user-select:none; }
canvas#game { position:fixed; inset:0; image-rendering:pixelated; cursor:crosshair; }
button { font-family:inherit; background:linear-gradient(#5a3fa8,#3a2878); color:#fff; border:1px solid #8a6ae8; border-radius:4px; padding:6px 12px; cursor:pointer; font-size:13px; }
button:hover { filter:brightness(1.2); } button:disabled { opacity:.4; cursor:default; }
button.alt { background:linear-gradient(#4a4458,#2e2a3a); border-color:#6a6480; }
button.gold { background:linear-gradient(#b8862a,#7a5a1a); border-color:var(--gold); }
button.mini { padding:3px 8px; font-size:12px; } button.on { outline:2px solid var(--gold); }
input,select { font-family:inherit; background:#1e1a2c; color:var(--text); border:1px solid var(--line); border-radius:4px; padding:6px 8px; font-size:13px; }
.row { display:flex; gap:6px; align-items:center; margin:6px 0; flex-wrap:wrap; } .row.small { font-size:12px; } .wrap { flex-wrap:wrap; }
.dim { color:var(--dim); font-size:12px; } .err { color:#ff6a6a; min-height:18px; }
h3,h4 { margin:8px 0 4px; } h4 { color:var(--gold); }
/* screens */
.screen { position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; background:radial-gradient(ellipse at center,#2a1f48 0%,#0b0a12 75%); z-index:50; }
.logo { font-family:'Press Start 2P'; font-size:52px; color:var(--gold); text-shadow:4px 4px 0 #8a2a1a, 0 0 30px rgba(255,200,80,.4); letter-spacing:4px; }
.logo span { display:block; font-size:20px; color:var(--acc); text-align:center; letter-spacing:12px; margin-top:8px; text-shadow:2px 2px 0 #1a3a5a; }
.logo.small { font-size:28px; position:absolute; top:16px; left:24px; } .logo.small span { font-size:11px; letter-spacing:6px; }
.sub { color:var(--dim); margin:14px 0 26px; }
.box { background:var(--panel); border:2px solid var(--line); padding:24px; border-radius:8px; width:340px; display:flex; flex-direction:column; gap:10px; }
.foot { position:absolute; bottom:18px; color:var(--dim); font-size:12px; }
.cs-wrap { display:flex; gap:20px; margin-top:60px; max-height:86vh; }
.cs-list,.cs-create { background:var(--panel); border:2px solid var(--line); border-radius:8px; padding:16px; overflow:auto; }
.cs-list { width:340px; } .cs-create { width:640px; }
.cs-item { display:flex; align-items:center; gap:10px; padding:6px; border-bottom:1px solid #2a2440; } .cs-item div { flex:1; } .cs-item .del { background:#5a1a2a; border-color:#a83a4a; }
.cls-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
.cls { text-align:center; padding:6px; border:2px solid #2a2440; border-radius:6px; cursor:pointer; background:#1a1628; font-size:12px; } .cls.sel { border-color:var(--gold); background:#2a2040; } .cls small { color:var(--dim); }
.cls-info { margin:10px 0; padding:10px; background:#1a1628; border-radius:6px; } .cls-info h2 { margin:0 0 6px; } .cls-info p { margin:4px 0; }
canvas.spr { image-rendering:pixelated; }
/* HUD */
#hud { display:none; }
#topleft { position:fixed; top:10px; left:10px; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:8px 12px; min-width:260px; z-index:5; }
#pname { font-weight:600; } #pname small { color:var(--dim); font-weight:300; }
#gold { color:var(--gold); font-size:12px; margin-top:2px; } #pots { font-size:12px; margin-top:2px; } #dodgecd { font-size:11px; color:var(--acc); }
#statuses span { display:inline-block; font-size:10px; padding:1px 3px; margin:2px 2px 0 0; border-radius:3px; color:#000; }
#topright { position:fixed; top:10px; right:10px; z-index:5; text-align:right; }
#minimap { width:210px; height:160px; border:2px solid var(--line); border-radius:6px; background:#000; image-rendering:pixelated; display:block; margin-left:auto; }
#zone { font-size:12px; color:var(--gold); margin:4px 0; }
#menu { display:grid; grid-template-columns:repeat(6,34px); gap:3px; justify-content:end; }
#menu button { padding:4px 0; font-size:15px; width:34px; }
#bottom { position:fixed; bottom:8px; left:50%; transform:translateX(-50%); z-index:5; text-align:center; }
.bar { position:relative; height:16px; background:#000; border:1px solid #333; border-radius:3px; overflow:hidden; margin:2px 0; }
.bar i { position:absolute; left:0; top:0; bottom:0; transition:width .15s; } .bar b { position:absolute; left:0; top:0; height:5px; background:#a0e0ff; }
.bar span { position:relative; font-size:11px; line-height:16px; text-shadow:1px 1px 0 #000; }
#hpbar i { background:linear-gradient(#e84a4a,#8a1a1a); } #mpbar i { background:linear-gradient(#4a8ae8,#1a3a8a); } #expbar { height:8px; } #expbar i { background:linear-gradient(#e8d84a,#8a6a1a); } #expbar span { font-size:8px; line-height:8px; }
.ginfo .bar i { background:linear-gradient(#e8d84a,#8a6a1a); }
.bars2 { display:flex; gap:6px; } .bars2 .bar { width:240px; }
#skillbar { display:flex; gap:5px; justify-content:center; margin:4px 0; }
.slot { position:relative; width:52px; height:52px; background:#0e0c16; border:2px solid #4a3f6a; border-radius:6px; cursor:pointer; overflow:hidden; }
.slot.ult { border-color:var(--gold); width:58px; height:58px; margin-top:-6px; }
.slot.nomp .sk { filter:grayscale(1) brightness(.5); }
.slot .cd { position:absolute; left:0; right:0; bottom:0; background:rgba(0,0,0,.72); }
.slot .cdt { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:15px; text-shadow:1px 1px 0 #000; }
.slot kbd { position:absolute; top:1px; left:3px; font-size:10px; color:#fff; text-shadow:1px 1px 0 #000; font-family:inherit; }
.sk { width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:24px; color:#fff; background:radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--c) 80%, white), var(--c) 45%, color-mix(in srgb, var(--c) 40%, black)); text-shadow:0 0 4px #000, 1px 1px 0 #000; border-radius:4px; }
.sk.u { box-shadow:inset 0 0 0 2px var(--gold); } .sk.big { width:56px; height:56px; font-size:30px; flex:none; }
#party { position:fixed; left:10px; top:150px; z-index:5; width:180px; } .pm { background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:4px 6px; margin-bottom:4px; font-size:12px; } .pm.off { opacity:.5; }
.mbar { height:5px; background:#300; margin-top:2px; } .mbar i { display:block; height:100%; background:#4ad86a; }
#bossbar { display:none; position:fixed; top:12px; left:50%; transform:translateX(-50%); width:520px; z-index:6; } #bossbar .bar { height:22px; border:2px solid #8a2a1a; } #bossbar i { background:linear-gradient(#ff4a2a,#8a0a0a); } #bossbar span { font-weight:600; line-height:22px; font-size:13px; }
#objective { display:none; position:fixed; right:10px; top:300px; width:230px; background:var(--panel); border:1px solid var(--gold); border-radius:6px; padding:8px 10px; font-size:12px; z-index:5; }
#chat { position:fixed; left:10px; bottom:10px; width:420px; z-index:6; }
#chat-log { height:160px; overflow-y:auto; background:rgba(0,0,0,.45); border-radius:6px 6px 0 0; padding:6px; font-size:12px; line-height:1.35; }
#chat-row { display:flex; } #chat-row select { width:90px; border-radius:0 0 0 6px; } #chat-input { flex:1; border-radius:0 0 6px 0; }
#toasts { position:fixed; top:110px; left:50%; transform:translateX(-50%); z-index:30; text-align:center; pointer-events:none; }
.toast { font-size:17px; font-weight:600; text-shadow:2px 2px 0 #000,0 0 8px #000; margin:4px; animation:fadein .3s; }
@keyframes fadein { from { opacity:0; transform:translateY(-8px); } }
#banner { position:fixed; top:30%; left:0; right:0; text-align:center; z-index:8; pointer-events:none; opacity:0; }
#banner div { font-family:'Press Start 2P'; font-size:26px; color:var(--gold); text-shadow:3px 3px 0 #000; } #banner small { font-size:14px; color:var(--acc); }
#banner.show { animation:banner 3s; } @keyframes banner { 0%{opacity:0} 15%{opacity:1} 75%{opacity:1} 100%{opacity:0} }
#respawn { display:none; position:fixed; inset:0; z-index:20; align-items:center; justify-content:center; flex-direction:column; pointer-events:none; }
#respawn h1 { font-family:'Press Start 2P'; color:#ff4a4a; text-shadow:3px 3px 0 #000; } #respawn button { pointer-events:auto; }
#leave-btn { display:none; position:fixed; right:10px; top:470px; z-index:6; }
#conn { position:fixed; inset:0; background:rgba(0,0,0,.8); z-index:100; display:none; align-items:center; justify-content:center; font-size:20px; }
/* windows */
.win { position:fixed; background:var(--panel); border:2px solid var(--line); border-radius:8px; z-index:100; max-height:86vh; display:flex; flex-direction:column; box-shadow:0 10px 40px rgba(0,0,0,.6); }
.wt { display:flex; justify-content:space-between; align-items:center; padding:6px 10px; background:linear-gradient(#3a2f5a,#241e38); border-radius:6px 6px 0 0; cursor:move; font-weight:600; color:var(--gold); }
.wt button { padding:2px 8px; background:#5a1a2a; border-color:#a83a4a; }
.wb { padding:10px 12px; overflow:auto; }
.tabs { display:flex; flex-wrap:wrap; gap:3px; margin-bottom:8px; } .tabs button { padding:4px 8px; font-size:12px; background:#2a2440; border-color:#4a3f6a; } .tabs button.on { background:#5a3fa8; outline:none; border-color:var(--gold); }
.inv-wrap { display:flex; gap:12px; }
.eq-grid { display:grid; grid-template-columns:repeat(2,64px); gap:6px; align-content:start; } .eqs { text-align:center; font-size:10px; color:var(--dim); } .eqs .it { margin:auto; }
.inv-grid { display:grid; grid-template-columns:repeat(10,44px); gap:3px; }
.it { position:relative; width:44px; height:44px; border:2px solid var(--c,#333); border-radius:4px; background:radial-gradient(circle, color-mix(in srgb, var(--c) 25%, #000), #0b0a12); display:flex; align-items:center; justify-content:center; font-size:20px; cursor:pointer; }
.it.empty { border-color:#2a2440; background:#0e0c16; cursor:default; }
.it em { position:absolute; right:1px; bottom:0; font-size:10px; font-style:normal; color:var(--gold); font-weight:600; } .it i { position:absolute; left:1px; top:0; font-size:9px; font-style:normal; } .it u { position:absolute; right:2px; top:0; color:#ff4a4a; text-decoration:none; font-weight:600; }
.mats { font-size:12px; margin-top:6px; }
#ctxmenu { position:fixed; display:none; z-index:300; background:#1e1a2c; border:1px solid var(--gold); border-radius:4px; min-width:170px; }
#ctxmenu div { padding:6px 10px; cursor:pointer; font-size:13px; } #ctxmenu div:hover { background:#3a2f5a; }
#tooltip { position:fixed; display:none; z-index:400; background:rgba(10,8,18,.97); border:1px solid var(--gold); border-radius:6px; padding:8px 10px; max-width:340px; font-size:12px; pointer-events:none; line-height:1.45; }
#tooltip hr { border:0; border-top:1px solid #3a3450; margin:4px 0; } .imp { color:#fff; font-weight:600; }
.stat-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; margin:6px 0; } .stat-grid div { background:#1a1628; padding:4px 6px; border-radius:4px; display:flex; justify-content:space-between; font-size:12px; } .stat-grid span { color:var(--dim); }
.sk-wrap { display:flex; gap:10px; } .sk-list { width:300px; max-height:62vh; overflow:auto; } .sk-detail { flex:1; }
.sk-row { display:flex; align-items:center; gap:8px; padding:4px; border-radius:4px; cursor:pointer; border:1px solid transparent; } .sk-row .sk { width:36px; height:36px; font-size:18px; flex:none; }
.sk-row:hover { background:#241e38; } .sk-row.sel { border-color:var(--gold); background:#2a2040; } .sk-row.locked { opacity:.45; } .sk-row div { flex:1; } .sk-row small { display:block; color:var(--dim); } .sk-row em { color:#5aff7a; font-style:normal; }
.sk-head { display:flex; gap:10px; align-items:center; } .sk-head h3 { margin:0; }
.rune-slots { display:flex; gap:6px; } .rs { flex:1; background:#1a1628; border:1px dashed #4a3f6a; border-radius:4px; padding:6px; font-size:12px; min-height:52px; } .rs.on { border:1px solid var(--acc); } .rs.lock { color:var(--dim); text-align:center; } .rs select { width:100%; }
.rune-list { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; max-height:56vh; overflow:auto; } .rune { background:#1a1628; border:1px solid #4a3f6a; border-radius:4px; padding:6px; font-size:12px; cursor:pointer; } .rune.none { opacity:.4; } .rune span { float:right; color:var(--acc); } .rune p { margin:4px 0 0; color:var(--dim); }
canvas#treecv { background:#0d0b16; border:1px solid var(--line); border-radius:6px; cursor:grab; display:block; } .legend { font-size:12px; margin-bottom:6px; } .legend span { margin-right:8px; }
.presets { display:grid; grid-template-columns:1fr 1fr; gap:8px; } .preset { background:#1a1628; border:1px solid #4a3f6a; border-radius:6px; padding:8px; } .preset.empty { opacity:.75; } .preset small { display:block; color:var(--dim); } .preset input { width:120px; }
.tag { font-size:10px; padding:1px 5px; border-radius:3px; margin-left:6px; } .tag.PvE { background:#2a6a3a; } .tag.PvP { background:#8a2a2a; }
.q { background:#1a1628; border:1px solid #2a2440; border-radius:4px; padding:6px 8px; margin-bottom:5px; } .q.act { border-color:var(--acc); }
.mlist div { padding:4px; border-bottom:1px solid #2a2440; display:flex; gap:4px; align-items:center; } .mlist small { color:var(--dim); flex:1; } .on { color:#5aff7a; } .off { color:#666; }
.ginfo { display:flex; gap:12px; align-items:center; } .ginfo h2 { margin:0; } .ginfo > div { flex:1; }
.tbl { width:100%; border-collapse:collapse; font-size:12px; } .tbl th { color:var(--gold); text-align:left; border-bottom:1px solid var(--line); } .tbl td { padding:3px 4px; border-bottom:1px solid #221c34; }
.pvp-modes { display:flex; gap:8px; } .pm-card { flex:1; background:#1a1628; border:1px solid var(--line); border-radius:6px; padding:8px; text-align:center; } .pm-card h3 { margin:2px 0; }
.blink { animation:blink 1s infinite; color:var(--acc); font-size:12px; display:block; } @keyframes blink { 50% { opacity:.3; } }
.mk { max-height:52vh; overflow:auto; } .mk-row { display:flex; align-items:center; gap:8px; padding:4px; border-bottom:1px solid #221c34; } .mk-row > div:nth-child(2) { flex:1; } .price { color:var(--gold); }
.sel-item { background:#1a1628; padding:8px; border-radius:6px; border:1px solid var(--line); font-size:12px; }
.wm { font-size:12px; line-height:1.8; } .wm span.cur { color:var(--acc); font-weight:600; } .wm small { color:var(--dim); }
.log { max-height:50vh; overflow:auto; font-size:12px; } .help { line-height:1.7; }
#invites { position:fixed; top:200px; left:50%; transform:translateX(-50%); z-index:250; } .invite { background:var(--panel); border:2px solid var(--gold); border-radius:6px; padding:10px; margin:4px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="login" class="screen"></div>
<div id="charsel" class="screen"></div>
<div id="hud">
  <div id="topleft"><div id="pname"></div><div id="gold"></div><div id="pots"></div><div id="dodgecd"></div><div id="statuses"></div></div>
  <div id="topright"><canvas id="minimap" width="210" height="160"></canvas><div id="zone"></div>
    <div id="menu">
      <button title="กระเป๋า [I]" data-act="menu" data-p="inventory">🎒</button><button title="ตัวละคร [C]" data-act="menu" data-p="character">🧍</button><button title="สกิล [K]" data-act="menu" data-p="skills">📘</button><button title="รูน [N]" data-act="menu" data-p="runes">💠</button><button title="Passive Tree [P]" data-act="menu" data-p="passives">🌳</button><button title="Build Presets [B]" data-act="menu" data-p="builds">📋</button>
      <button title="เควสต์ [J]" data-act="menu" data-p="quests">📜</button><button title="ปาร์ตี้ [O]" data-act="menu" data-p="party">👥</button><button title="กิลด์ [G]" data-act="menu" data-p="guild">🏰</button><button title="PvP [V]" data-act="menu" data-p="pvp">⚔</button><button title="แผนที่ [M]" data-act="menu" data-p="worldmap">🗺</button><button title="ช่วยเหลือ [H]" data-act="menu" data-p="help">❔</button>
    </div>
    <button class="alt mini" style="margin-top:4px" data-act="logout">เปลี่ยนตัวละคร</button>
  </div>
  <div id="party"></div>
  <div id="bossbar"><div class="bar"><i></i><span></span></div></div>
  <div id="objective"></div>
  <button id="leave-btn" class="alt" data-act="leaveInst">ออกจากดันเจี้ยน</button>
  <div id="bottom">
    <div id="skillbar"></div>
    <div class="bars2"><div id="hpbar" class="bar"><i></i><b></b><span></span></div><div id="mpbar" class="bar"><i></i><span></span></div></div>
    <div id="expbar" class="bar"><i></i><span></span></div>
  </div>
  <div id="chat"><div id="chat-log"></div><div id="chat-row"><select id="chat-ch"><option value="say">พูด</option><option value="world">โลก</option><option value="party">ปาร์ตี้</option><option value="guild">กิลด์</option></select><input id="chat-input" placeholder="Enter เพื่อแชท • /w ชื่อ ข้อความ" maxlength="200"></div></div>
  <div id="respawn"><h1>คุณตายแล้ว</h1><div id="respawn-t"></div><button data-act="respawn">ฟื้นคืนชีพ</button></div>
</div>
<div id="banner"></div>
<div id="toasts"></div>
<div id="windows"></div>
<div id="invites"></div>
<div id="ctxmenu"></div>
<div id="tooltip"></div>
<div id="conn">กำลังเชื่อมต่อเซิร์ฟเวอร์...</div>
<script type="module" src="/client/js/main.js"></script>
</body>
</html>
